<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メンバー | NOCTÉLIE Guitar Ensemble</title>
<meta name="description" content="ギターアンサンブル Noctélie（NOCTÉLIE Guitar Ensemble）のメンバー紹介。">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Inter:wght@500;800&family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  .top{background:linear-gradient(rgba(14,42,35,.25),rgba(14,42,35,.25)),url(img/sky_wide.jpg) center 35%/cover no-repeat,var(--green-deep);color:var(--white);padding:130px 8vw 0;text-align:center}
  .top .ring{width:min(260px,62vw);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px var(--white);position:relative;top:70px}
  .top .ring img.photo{width:100%;height:100%;object-fit:cover;object-position:center 25%}
  .top .ring img.mark{height:62%;width:auto}
  .top .ring{animation:popIn 1s cubic-bezier(.2,.7,.2,1) both}
  .ring-wrap{position:relative;width:min(260px,62vw);margin:0 auto;top:70px}
  .ring-wrap .ring{top:0}
  .ring-wrap::before,.ring-wrap::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--white);animation:halo 2.6s ease-out 1s infinite;pointer-events:none}
  .ring-wrap::after{animation-delay:2.3s}
  .orbit{position:absolute;inset:-18px;border-radius:50%;border:1px dashed rgba(255,255,255,.7);animation:spin 40s linear infinite;pointer-events:none}
  .intro .en,.intro h1,.intro .roman,.intro .role{animation:fadeUp .9s ease both}
  .intro h1{animation-delay:.25s}.intro .roman{animation-delay:.4s}.intro .role{animation-delay:.55s}
  .intro h1 .ch{display:inline-block;animation:fadeUp .7s ease both}
  .sns a{transition:padding .25s,background .25s}
  .sns a:hover{padding-left:14px;background:var(--pink-soft)}
  .top{position:relative;overflow:hidden}
  /* 点線の輪の上を、ピンクの星がまわる */
  .orbit::after{content:"";position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;background:var(--star);clip-path:path("M8 0Q8 8 16 8Q8 8 8 16Q8 8 0 8Q8 8 8 0Z");filter:drop-shadow(0 0 4px rgba(226,132,168,.9))}
  .bigname{position:absolute;left:0;right:0;bottom:-0.18em;font-family:"Cinzel",serif;font-size:clamp(44px,11vw,150px);line-height:1;letter-spacing:.04em;color:rgba(255,255,255,.16);white-space:nowrap;text-align:center;pointer-events:none;animation:fadeUp 1.4s ease .3s both}
  .top{overflow:visible}.top .bigname{overflow:hidden}
  .badges{display:flex;justify-content:center;flex-wrap:wrap;gap:18px 26px;margin:44px auto 0;max-width:640px}
  .badge{width:132px;text-align:center;position:relative}
  .badge svg{width:132px;height:96px;display:block;overflow:visible}
  .badge .bt{position:absolute;left:0;right:0;top:30px;font-family:"Noto Serif JP",serif;color:var(--pink-deep);font-size:21px;font-weight:600;letter-spacing:.06em;line-height:1.1}
  .badge .bt small{display:block;font-size:11px;font-weight:400;letter-spacing:.04em}
  .badge .bl{font-size:11px;color:var(--sub);line-height:1.5;margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
  .intro{padding:120px 8vw 40px;text-align:center}
  .intro .en{display:block}
  .intro h1{font-family:"Noto Serif JP",serif;font-weight:400;font-size:clamp(26px,4vw,36px);letter-spacing:.2em;margin-top:10px}
  .intro .roman{font-family:"Cinzel",serif;letter-spacing:.18em;color:var(--sub);font-size:14px;margin-top:4px}
  .intro .role{margin-top:18px;font-size:14px;color:var(--sub);letter-spacing:.1em}
  .career{list-style:none;max-width:560px;margin:40px auto 0;text-align:left;border-top:1px solid var(--line)}
  .career li{padding:14px 4px 14px 22px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
  .career li::before{content:"";position:absolute;left:4px;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:var(--pink)}
  .intro .msg{max-width:560px;margin:36px auto 0;text-align:left}
  .sns{max-width:560px;margin:0 auto;padding:40px 16px 100px}
  .sns ul{list-style:none;border-top:1px solid var(--line)}
  .sns li{border-bottom:1px solid var(--line)}
  .sns a,.sns .row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 4px;text-decoration:none}
  .sns .label{font-family:"Cinzel",serif;font-size:18px;letter-spacing:.1em}
  .sns .val{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sns a:hover .label{color:var(--pink)}
  .others{background:var(--pink-soft);padding:80px 8vw}
  .others .members{max-width:960px;margin:0 auto}
  .live{background:var(--night);color:var(--white);display:grid;grid-template-columns:1.5fr 1fr;margin-bottom:0;padding:0!important}
  .live[hidden]{display:none}
  .live img{width:100%;height:100%;object-fit:cover;min-height:380px}
  .live .txt{padding:80px 6vw;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(rgba(14,42,35,.45),rgba(14,42,35,.45)),url(img/sky_tall.jpg) center/cover no-repeat}
  .live .en{color:var(--star)}
  .live h2{font-family:"Noto Serif JP",serif;font-weight:400;font-size:26px;letter-spacing:.2em;margin:8px 0 24px}
  .live p{opacity:.9;font-size:15px}
  @media (max-width:820px){.live{grid-template-columns:1fr}.live img{min-height:0;height:auto}.live .txt{padding:56px 16px}}
  .back{display:block;text-align:center;margin-top:48px;font-family:"Cinzel",serif;letter-spacing:.2em;font-size:13px;color:var(--pink);text-decoration:none}
</style>
</head>
<body>
<script src="assets/intro.js"></script>
<script src="assets/stars.js" defer></script>
<header>
  <a class="logo" href="index.html"><img src="assets/noct_head.png" alt=""><span>NOCTÉLIE</span></a>
  <nav>
    <a href="index.html#ensemble">Ensemble</a>
    <a href="index.html#members">Members</a>
    <a href="index.html#contact">Contact</a>
  </nav>
</header>

<main>
  <div class="top" data-stars><div class="bigname" id="bigname"></div><div class="ring-wrap"><div class="orbit"></div><div class="ring" id="ring"></div></div></div>
  <div class="intro">
    <span class="en">Member</span>
    <h1 id="name"></h1>
    <div class="roman" id="roman"></div>
    <div class="role" id="role"></div>
    <div class="badges" id="badges"></div>
    <ul class="career" id="career"></ul>
    <p class="msg" id="msg"></p>
  </div>
  <div class="sns"><ul id="sns"></ul></div>
  <section class="live" id="live" hidden><img id="live-img" src="" alt=""><div class="txt" data-stars data-density="0.5"><span class="en">Live</span><h2>ライブ</h2><p id="live-text"></p></div></section>
  <div class="others">
    <div class="head" style="text-align:center"><span class="en">Members</span></div>
    <div class="members" id="member-list"></div>
    <a class="back" href="index.html">← Top</a>
  </div>
</main>

<footer data-stars><img class="f-word" src="assets/noct_word.png" alt="NOCTÉLIE Guitar Ensemble"><div>&copy; 2026 NOCTÉLIE Guitar Ensemble</div></footer>
<script src="assets/members.js"></script>
<script>
(function(){
  var list=window.MEMBERS||[];
  var id=new URLSearchParams(location.search).get('m');
  var idx=Math.max(0,list.findIndex(function(m){return m.id===id;}));
  var m=list[idx]; if(!m) return;
  var blank=function(t){return '<span class="blank">'+t+'</span>';};
  var esc=function(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;};

  var img=document.createElement('img');
  if(m.photo){img.src=m.photo;img.className='photo';img.alt=m.name;if(m.photoPos)img.style.objectPosition=m.photoPos;} else {img.src='assets/noct_head.png';img.className='mark';img.alt='';}
  document.getElementById('ring').appendChild(img);

  document.getElementById('name').innerHTML=m.name?Array.from(m.name).map(function(c,i){return c===' '?' ':'<span class="ch" style="animation-delay:'+(0.3+i*0.08)+'s">'+esc(c)+'</span>';}).join(''):blank('メンバー'+(idx+1));
  document.getElementById('roman').textContent=m.roman||'';
  var role=[m.role,m.part&&('担当 '+m.part)].filter(Boolean).join(' ／ ');
  document.getElementById('role').innerHTML=role?esc(role):blank('担当パート 準備中');
  document.getElementById('bigname').textContent=(m.roman||'NOCTÉLIE');
  /* 受賞を月桂樹のバッジに（見本: Modulesss 月桂冠・受賞系） */
  var leaf='';for(var k=0;k<7;k++){var dg=100+k*20,rr=(k%2?47:53),an=dg*Math.PI/180,cx=66+rr*Math.cos(an),cy=46+42*Math.sin(an),rot=dg+(k%2?-25:25);
    leaf+='<ellipse cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="3" ry="7" transform="rotate('+rot+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')"/>';
    var cx2=132-cx; leaf+='<ellipse cx="'+cx2.toFixed(1)+'" cy="'+cy.toFixed(1)+'" rx="3" ry="7" transform="rotate('+(-rot)+' '+cx2.toFixed(1)+' '+cy.toFixed(1)+')"/>';}
  var laurel='<svg viewBox="0 0 132 96" fill="var(--pink)" aria-hidden="true">'+leaf+'<path d="M40 86Q66 98 92 86" fill="none" stroke="var(--pink)" stroke-width="1.2"/></svg>';
  var bx=document.getElementById('badges');
  (m.career||[]).forEach(function(c){
    var mt=c.match(/(\d+年連続)?(第\d+位|特別金賞|最優秀賞|金賞)/); if(!mt) return;
    var big=mt[2], sub=mt[1]||'';
    var label=c.replace(mt[0],'').replace(/（.*?）/g,'').replace(/第\d+回\s*/,'').trim();
    var b=document.createElement('div'); b.className='badge';
    b.innerHTML=laurel+'<div class="bt">'+(sub?'<small>'+esc(sub)+'</small>':'')+'<span style="font-size:'+(big.length>3?16:21)+'px">'+esc(big)+'</span></div><div class="bl">'+esc(label)+'</div>';
    bx.appendChild(b);
  });
  if(!bx.children.length) bx.style.display='none';
  var cl=document.getElementById('career');
  (m.career||[]).forEach(function(c){var li=document.createElement('li');li.textContent=c;cl.appendChild(li);});
  if(!(m.career||[]).length) cl.style.display='none';
  document.getElementById('msg').innerHTML=m.message?esc(m.message):'';
  if(!m.message) document.getElementById('msg').style.display='none';
  if(m.name) document.title=m.name+' | NOCTÉLIE Guitar Ensemble';

  if(m.live){var lv=document.getElementById('live');lv.hidden=false;var li_=document.getElementById('live-img');li_.src=m.live.photo;li_.alt=m.live.alt||'';document.getElementById('live-text').textContent=m.live.text||'';}
  var sns=[['Instagram','instagram'],['YouTube','youtube'],['TikTok','tiktok'],['X','x']];
  var ul=document.getElementById('sns');
  sns.forEach(function(s){
    var url=m[s[1]]; var li=document.createElement('li');
    if(url){
      var shown=url.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'');
      li.innerHTML='<a href="'+encodeURI(url)+'" target="_blank" rel="noopener"><span class="label">'+s[0]+'</span><span class="val">'+esc(shown)+'</span></a>';
    } else if(s[1]==='instagram'||s[1]==='youtube'){
      li.innerHTML='<div class="row"><span class="label" style="color:var(--sub)">'+s[0]+'</span><span class="val">'+blank('準備中')+'</span></div>';
    } else return;
    ul.appendChild(li);
  });
})();
</script>
<script src="assets/members-list.js"></script>
<script src="assets/motion.js"></script>
</body>
</html>
